<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 980" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do SGL</title>
  <desc id="desc">Arquitetura em camadas e fluxo de estoque do SGL, com REST, services, JPA, PostgreSQL, FEFO/FIFO e auditoria.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/><stop offset="1" stop-color="#121217"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="820" height="980" rx="34" fill="url(#bg)"/>
  <rect x="1" y="1" width="818" height="978" rx="33" fill="none" stroke="#29292f"/>

  <text x="52" y="66" fill="#f4f4f5" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">SGL / BACKEND ARCHITECTURE</text>
  <text x="52" y="98" fill="#7b7b84" font-family="Inter,Arial,sans-serif" font-size="15">Do contrato REST à regra de negócio e persistência</text>
  <circle cx="748" cy="64" r="7" fill="#b91c1c"/>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="142" width="680" height="82" rx="18" fill="#131318" stroke="#34343b"/>
    <text x="96" y="175" fill="#f4f4f5" font-size="18" font-weight="700">HTTP / REST + DTOs</text>
    <text x="96" y="201" fill="#92929b" font-size="14">Requests · Responses · Bean Validation · OpenAPI</text>

    <path d="M410 224V250" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="70" y="262" width="680" height="82" rx="18" fill="#131318" stroke="#34343b"/>
    <text x="96" y="295" fill="#f4f4f5" font-size="18" font-weight="700">CONTROLLERS</text>
    <text x="96" y="321" fill="#92929b" font-size="14">Endpoints · status HTTP · contratos de entrada e saída</text>

    <path d="M410 344V370" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="70" y="382" width="680" height="112" rx="18" fill="#171315" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="96" y="417" fill="#f4f4f5" font-size="19" font-weight="700">SERVICES / DOMAIN</text>
    <text x="96" y="447" fill="#ef4444" font-size="14" font-weight="700">FEFO / FIFO · Pedidos · Transações · Auditoria</text>
    <text x="96" y="474" fill="#a6a6ae" font-size="14">Reserva · baixa · entrega · cancelamento · estorno</text>

    <path d="M410 494V520" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="70" y="532" width="318" height="92" rx="18" fill="#111116" stroke="#34343b"/>
    <text x="94" y="568" fill="#f4f4f5" font-size="18" font-weight="700">JPA / HIBERNATE</text>
    <text x="94" y="596" fill="#92929b" font-size="14">Repositories + entidades</text>

    <rect x="432" y="532" width="318" height="92" rx="18" fill="#111116" stroke="#34343b"/>
    <text x="456" y="568" fill="#f4f4f5" font-size="18" font-weight="700">POSTGRESQL</text>
    <text x="456" y="596" fill="#92929b" font-size="14">Schema versionado · Flyway</text>

    <path d="M388 578H420" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <text x="70" y="684" fill="#f4f4f5" font-size="18" font-weight="700">BUSINESS FLOW</text>

    <rect x="70" y="710" width="145" height="62" rx="14" fill="#131318" stroke="#34343b"/>
    <text x="142" y="748" text-anchor="middle" fill="#d4d4d8" font-size="14" font-weight="700">PEDIDO</text>

    <path d="M215 741H250" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="262" y="710" width="145" height="62" rx="14" fill="#131318" stroke="#34343b"/>
    <text x="334" y="738" text-anchor="middle" fill="#d4d4d8" font-size="13" font-weight="700">VALIDA</text>
    <text x="334" y="758" text-anchor="middle" fill="#8f8f98" font-size="12">estoque</text>

    <path d="M407 741H442" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="454" y="710" width="145" height="62" rx="14" fill="#171315" stroke="#7f1d1d"/>
    <text x="526" y="738" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">FEFO / FIFO</text>
    <text x="526" y="758" text-anchor="middle" fill="#8f8f98" font-size="12">seleciona lotes</text>

    <path d="M599 741H634" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="646" y="710" width="104" height="62" rx="14" fill="#131318" stroke="#34343b"/>
    <text x="698" y="738" text-anchor="middle" fill="#d4d4d8" font-size="13" font-weight="700">BAIXA</text>
    <text x="698" y="758" text-anchor="middle" fill="#8f8f98" font-size="12">auditada</text>

    <rect x="70" y="812" width="680" height="96" rx="18" fill="#101014" stroke="#2c2c33"/>
    <text x="96" y="846" fill="#f4f4f5" font-size="16" font-weight="700">DOMÍNIO MODELADO</text>
    <text x="96" y="875" fill="#a1a1aa" font-size="14">Unidade → Laboratórios → Projetos → Pedidos</text>
    <text x="96" y="898" fill="#a1a1aa" font-size="14">Estoque → Produtos → Lotes físicos → Movimentações</text>
  </g>

  <text x="52" y="950" fill="#5f5f67" font-family="Inter,Arial,sans-serif" font-size="12">MODELED FROM DOMAIN → BUSINESS RULES → API → DATA</text>
  <text x="768" y="950" text-anchor="end" fill="#71717a" font-family="Inter,Arial,sans-serif" font-size="12">BACKEND COMPLETE</text>
</svg>