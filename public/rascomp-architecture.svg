<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 980" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do RASCOMP</title>
  <desc id="desc">Fluxo conceitual do RASCOMP: API e banco sustentam o front de gestão; o front de gestão configura categorias e alimenta a publicação no front público.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/><stop offset="1" stop-color="#121217"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="820" height="980" rx="34" fill="url(#bg)"/>
  <rect x="1" y="1" width="818" height="978" rx="33" fill="none" stroke="#29292f"/>

  <text x="52" y="66" fill="#f4f4f5" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">RASCOMP / PRODUCT FLOW</text>
  <text x="52" y="98" fill="#7b7b84" font-family="Inter,Arial,sans-serif" font-size="15">Da modelagem da competição à publicação dos resultados</text>
  <circle cx="748" cy="64" r="7" fill="#b91c1c"/>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="140" width="680" height="118" rx="20" fill="#171315" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="96" y="177" fill="#f4f4f5" font-size="19" font-weight="700">SPRING BOOT REST API</text>
    <text x="96" y="207" fill="#ef4444" font-size="14" font-weight="700">JWT · OWNERSHIP · REGRAS DE DOMÍNIO</text>
    <text x="96" y="234" fill="#a6a6ae" font-size="14">Equipes · competidores · robôs · competições · categorias · inscrições</text>

    <path d="M410 258V288" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="70" y="300" width="290" height="96" rx="18" fill="#111116" stroke="#34343b"/>
    <text x="94" y="336" fill="#f4f4f5" font-size="18" font-weight="700">MYSQL + JPA</text>
    <text x="94" y="365" fill="#92929b" font-size="14">Persistência · Flyway</text>

    <rect x="460" y="300" width="290" height="96" rx="18" fill="#111116" stroke="#34343b"/>
    <text x="484" y="336" fill="#f4f4f5" font-size="18" font-weight="700">FRONT DE GESTÃO</text>
    <text x="484" y="365" fill="#92929b" font-size="14">Organização · operação · resultados</text>

    <path d="M410 258V278H605V290" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M410 258V278H215V290" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <text x="70" y="456" fill="#f4f4f5" font-size="18" font-weight="700">CONFIGURAÇÃO DA COMPETIÇÃO</text>

    <rect x="70" y="484" width="680" height="100" rx="18" fill="#101014" stroke="#303038"/>
    <text x="96" y="520" fill="#d4d4d8" font-size="16" font-weight="700">COMPETIÇÃO → CATEGORIAS</text>
    <text x="96" y="550" fill="#92929b" font-size="14">Criadas pela API e alimentadas/operadas pelo Front de Gestão</text>

    <path d="M410 584V614" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="70" y="626" width="318" height="142" rx="18" fill="#111116" stroke="#34343b"/>
    <text x="94" y="663" fill="#f4f4f5" font-size="18" font-weight="700">FOLLOW_LINE</text>
    <text x="94" y="692" fill="#a1a1aa" font-size="14">Configuração · tomadas · tentativas</text>
    <text x="94" y="718" fill="#a1a1aa" font-size="14">penalidades · checkpoints · ranking</text>
    <text x="94" y="744" fill="#71717a" font-size="12">categoria da competição</text>

    <rect x="432" y="626" width="318" height="142" rx="18" fill="#111116" stroke="#34343b"/>
    <text x="456" y="663" fill="#f4f4f5" font-size="18" font-weight="700">SUMÔ</text>
    <text x="456" y="692" fill="#a1a1aa" font-size="14">Configuração · inspeção · bracket</text>
    <text x="456" y="718" fill="#a1a1aa" font-size="14">matches · rounds · progressão</text>
    <text x="456" y="744" fill="#71717a" font-size="12">categoria da competição</text>

    <path d="M605 396V806" stroke="#3f3f46" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="70" y="818" width="680" height="94" rx="18" fill="#171315" stroke="#7f1d1d"/>
    <text x="96" y="853" fill="#f4f4f5" font-size="18" font-weight="700">FRONT PÚBLICO</text>
    <text x="96" y="882" fill="#a6a6ae" font-size="14">Última etapa: equipes · rankings · chaves · vencedores · resultados publicados</text>

    <text x="628" y="610" fill="#71717a" font-size="12">publica / alimenta</text>
  </g>

  <text x="52" y="950" fill="#5f5f67" font-family="Inter,Arial,sans-serif" font-size="12">API + DATA → MANAGEMENT → CATEGORIES → PUBLIC EXPERIENCE</text>
  <text x="768" y="950" text-anchor="end" fill="#71717a" font-family="Inter,Arial,sans-serif" font-size="12">API VALIDATED</text>
</svg>